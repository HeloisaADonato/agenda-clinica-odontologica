services:
  - type: web
    name: agenda-clinica-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/saude
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_BANCO
        value: clinica
      - key: JWT_SECRET
        generateValue: true
      - key: ORIGENS_PERMITIDAS
        value: https://heloisaadonato.github.io
